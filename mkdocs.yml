site_name: PixelActorMaker
site_description: 像素角色动画与帧事件编辑器 —— 图层/调色板/多轨时间轴/帧事件/GIF 导出
site_url: https://r5r6ty.github.io/PixelActorMaker/
repo_url: https://github.com/r5r6ty/PixelActorMaker
theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight
palette:
  - scheme: default
    primary: indigo
plugins:
  - search
  - i18n:
      docs_structure: folder
      default_language: zh
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
      nav_translations:
        en:
          首页: Home
          快速上手: Quick Start
          使用手册: Manual
          数据格式: Data Format
          像素动画编辑器（gal）: Pixel Animation Editor (gal)
          帧事件编辑器（sff/air/snd）: Frame Event Editor (sff/air/snd)
          GIF 导出: GIF Export
          常见问题: FAQ
          .sff / .air / .snd 与 PAMSDK_Unity: .sff / .air / .snd with PAMSDK_Unity
        ko:
          首页: 홈
          快速上手: 빠른 시작
          使用手册: 사용 설명서
          数据格式: 데이터 포맷
          像素动画编辑器（gal）: 픽셀 애니메이션 편집기 (gal)
          帧事件编辑器（sff/air/snd）: 프레임 이벤트 편집기 (sff/air/snd)
          GIF 导出: GIF 내보내기
          常见问题: 자주 묻는 질문
          .sff / .air / .snd 与 PAMSDK_Unity: .sff / .air / .snd 및 PAMSDK_Unity
nav:
  - 首页: index.md
  - 快速上手: quickstart.md
  - 使用手册:
      - 像素动画编辑器（gal）: manual/gal-editor.md
      - 帧事件编辑器（sff/air/snd）: manual/main-editor.md
      - GIF 导出: manual/gif-export.md
      - 常见问题: manual/faq.md
  - 数据格式:
      - .sff / .air / .snd 与 PAMSDK_Unity: format/sff-air-snd.md
